name: Supabase keepalive

on:
  schedule:
    # GitHub Actions cron cannot express a true rolling 72-hour interval, so this
    # uses the closest native cadence: 12:00 UTC on every third day-of-month.
    - cron: "0 12 */3 * *"
  workflow_dispatch:
    inputs:
      keepalive_table:
        description: Public table to query for keepalive
        required: false
        default: ideas

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Run lightweight Supabase keepalive query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_TABLE: ${{ github.event.inputs.keepalive_table }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured."
            exit 1
          fi

          raw_keepalive_table="${KEEPALIVE_TABLE:-}"
          if [ -n "${raw_keepalive_table}" ]; then
            case "${raw_keepalive_table}" in
              *[!A-Za-z0-9_-]*)
                echo "KEEPALIVE_TABLE must contain only letters, numbers, underscores, or hyphens."
                exit 1
                ;;
            esac
          fi

          keepalive_table="${raw_keepalive_table:-ideas}"
          endpoint="${SUPABASE_URL%/}/rest/v1/${keepalive_table}?select=id&limit=1"
          echo "Running keepalive query against ${endpoint}"

          response_headers="$(mktemp)"
          response_body="$(mktemp)"
          trap 'rm -f "${response_headers}" "${response_body}"' EXIT

          status_code="$(
            curl --silent --show-error --location \
              --dump-header "${response_headers}" \
              --output "${response_body}" \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Prefer: count=exact" \
              "${endpoint}"
          )"

          echo "Supabase keepalive HTTP status: ${status_code}"
          grep -i '^content-range:' "${response_headers}" | tr -d '\r' || true
          cat "${response_body}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Supabase keepalive query failed."
            exit 1
          fi
