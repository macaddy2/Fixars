name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      keepalive_table:
        description: Public table to query for keepalive
        required: false
        default: ideas

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Run lightweight Supabase keepalive query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_TABLE: ${{ github.event.inputs.keepalive_table }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            epoch_days=$(( $(date -u +%s) / 86400 ))
            if [ $(( epoch_days % 3 )) -ne 0 ]; then
              echo "Skipping scheduled keepalive run to maintain a 3-day cadence."
              exit 0
            fi
          fi

          raw_keepalive_table="${KEEPALIVE_TABLE:-}"
          if [ -n "${raw_keepalive_table}" ]; then
            case "${raw_keepalive_table}" in
              *[!A-Za-z0-9_-]*)
                echo "KEEPALIVE_TABLE must contain only letters, numbers, underscores, or hyphens."
                exit 1
                ;;
            esac
          fi

          keepalive_table="${raw_keepalive_table:-ideas}"
          endpoint="${SUPABASE_URL%/}/rest/v1/${keepalive_table}?select=id&limit=1"
          echo "Running keepalive query for table ${keepalive_table}"

          response_headers="$(mktemp)"
          response_body="$(mktemp)"
          trap 'rm -f "${response_headers}" "${response_body}"' EXIT

          status_code="$(
            curl --silent --show-error --location \
              --dump-header "${response_headers}" \
              --output "${response_body}" \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${endpoint}"
          )"

          echo "Supabase keepalive HTTP status: ${status_code}"
          python - <<'PYTHON' "${response_body}"
import json
import pathlib
import sys

body = pathlib.Path(sys.argv[1]).read_text().strip()
if not body:
    print('Supabase keepalive result: empty response body')
    raise SystemExit(0)

try:
    payload = json.loads(body)
except json.JSONDecodeError:
    print(f'Supabase keepalive result: non-JSON response ({len(body)} bytes)')
    raise SystemExit(0)

if isinstance(payload, list):
    print(f'Supabase keepalive result: {len(payload)} row(s) returned')
elif isinstance(payload, dict):
    print(f"Supabase keepalive result: object response with keys {', '.join(sorted(payload.keys()))}")
else:
    print(f'Supabase keepalive result: {type(payload).__name__} response')
PYTHON

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Supabase keepalive query failed."
            exit 1
          fi
