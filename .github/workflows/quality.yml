name: Quality checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  platform:
    name: Fixars platform build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Session and ledger tests
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GH_PAGES: "true"

      - name: Build with real-session client flag
        run: npm run build
        env:
          VITE_REAL_SESSION: "1"

  landing-page:
    name: Landing page build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Sites package
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites
